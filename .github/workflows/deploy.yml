# Publishes the website with the most recent data runs (GitHub Releases). See publishing-data.md.
# The finished site (code + data) is pushed as a single commit to the gh-pages branch, which GitHub Pages
# serves. A new commit per deploy means new data always goes live, and old data doesn't pile up in git.
name: Deploy website

on:
  release:
    types: [published, deleted]
  push:
    branches: [main]
    paths: ["site/**", "tests/**", "tools/build_site_data.py", "tools/version_site_assets.py", "score-years.json", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}  # a release points at a tag; always use the current code

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test ranking, journal details and search
        run: |
          node tests/engine.test.mjs
          node tests/journal-details.test.mjs
          node tests/main-page.test.mjs

      - name: Download the latest run and the runs that score years are frozen to
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          mkdir runs
          for tag in $latest $(jq -r '.[]' score-years.json | sort -u); do
            [ -d "runs/$tag" ] || gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "runs/$tag"
          done
          echo "LATEST_RUN=$latest" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the data and add it to the site
        run: |
          pip install pyarrow
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/build_site_data.py runs "$LATEST_RUN" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"

      - name: Add a version to the code links, so browsers never mix old and new files
        run: python tools/version_site_assets.py site "${GITHUB_SHA::7}"

      - name: Publish the site to the gh-pages branch
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Website built from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
